<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors - CSS</title>
    <style>
        #firstPara{
            color:red; /* Color By name */
        }
        #secondPara{
            color:#00FF00; /* Color By Hexadecimal */
        }
        #thirdPara{
            color:rgb(0,0,255); /* Color By RGB */
            background-color: rgb(255, 0, 0); /* Background Color By RGB */
        }
    </style>
</head>
<body>
    <h3>Colors - CSS</h3>
    <p id="firstPara">Learning colors in CSS.</p>
    <p id="secondPara">This is a second Paragraph.</p>
    <p id="thirdPara">This is a third Paragraph.</p>
</body>
</html>
