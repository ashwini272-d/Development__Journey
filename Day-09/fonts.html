<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts in Html</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Edu+VIC+WA+NT+Hand:wght@400..700&display=swap" rel="stylesheet">
    <style>
        p{
            font-size: 20px;
            font-family: "Edu VIC WA NT Hand", cursive;
            line-height: 8.3em;
            font-style: italic;
        }
        span{
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h3>CSS Fonts</h3>
    <p>Leys Play with <span>Fonts</span>. It is very exciting!</p>
</body>
</html>
