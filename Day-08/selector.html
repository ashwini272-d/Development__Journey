<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector</title>
    <style>
        /* Element Selector  */
        footer{
            background-color: yellow;
        }
         /* ID Selector */
        #redElement{
            background-color: red;
        }
        /* Class Selector */
        .bgblue{
            background-color: blue;
        }
        /* Grouping Selector */
        p,span{
            color: white;
        }
    </style>
</head>
<body>
    <h3>CSS Selector</h3>
    <p>This is a simple paragraph.</p>
    <p id="redElement">This is a paragraph with a red background.</p>
    <div>
        <p class="bgblue">This is a paragraph with a blue background.</p>
    </div>
    <span class="bgblue">This is a span with a blue background.</span>
    <footer>
        this is a footer.
    </footer>
</body>
</html>
