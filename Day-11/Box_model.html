<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model Practice</title>

    <style>

        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }


        .box {
            width: 300px;
            height: 150px;

            padding: 20px;

            border: 5px solid black;

            margin: 30px;

            background-color: lightblue;
        }


        .box2 {
            width: 250px;
            height: 100px;

            padding: 40px;

            border: 10px dashed red;

            margin: 50px;

            background-color: lightgreen;
        }


        .box3 {
            width: 300px;
            height: 150px;

            padding: 20px;

            border: 5px solid purple;

            margin: 30px;

            box-sizing: border-box;

            background-color: pink;
        }


    </style>

</head>

<body>

    <h1>CSS Box Model Practice</h1>


    <div class="box">
        <h2>Box 1</h2>
        <p>
            Width: 300px <br>
            Height: 150px <br>
            Padding: 20px <br>
            Border: 5px
        </p>
    </div>


    <div class="box2">
        <h2>Box 2</h2>
        <p>
            Different padding, border and margin
        </p>
    </div>


    <div class="box3">
        <h2>Box 3</h2>
        <p>
            Using box-sizing: border-box
        </p>
    </div>


</body>
</html>
