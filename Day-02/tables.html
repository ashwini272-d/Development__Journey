<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables is Html</title>
</head>
<body>
    <h1>Tables</h1>
    <h2>Education Table</h2>
    <table border="2">
        <thead>
            <tr>
                <th>School</th>
                <th>Result</th>
                <th>Passing year</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>HTS School</td>
                <td>84.6%</td>
                <td>2022</td>
            </tr>
            <tr>
                <td>K.K.College(BCA)</td>
                <td>7.88 cpi</td>
                <td>2025</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
